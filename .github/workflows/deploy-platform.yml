name: Deploy STARK platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - 'relay/**'
      - 'firestore.rules'
      - 'firebase.json'
      - '.github/workflows/deploy-platform.yml'
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and test the Ask STARK relay
        working-directory: relay/functions
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Deploy to Firebase (platform, security rules, relay)
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@13.29.1 deploy \
            --only hosting,firestore:rules,functions:stark \
            --project stark-91dfe --force --non-interactive
