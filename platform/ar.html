<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SMART Lab · AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;600;800&display=swap" rel="stylesheet">
<script type="module" src="vendor/model-viewer.min.js"></script>
<style>
:root{--bg:#07130D;--panel:#0B1E15;--line:#1F4430;--fg:#F2F7ED;--mut:#A7C2B2;--lime:#86C242;--ar:'Alexandria',Tahoma,Arial,sans-serif;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.6 var(--ar);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:800;background:#055934;border-radius:8px;padding:3px 10px;direction:ltr;white-space:nowrap}.brand b{color:var(--lime)}
.ttl{font-weight:800;font-size:15px;line-height:1.3;flex:1;min-width:0}.ttl small{display:block;font-weight:400;font-size:12px;color:var(--mut)}
#lang{border:1px solid var(--line);background:none;color:var(--fg);font:600 12px var(--ar);border-radius:99px;padding:5px 12px;cursor:pointer}
model-viewer{flex:1;min-height:0;width:100%;background:radial-gradient(120% 90% at 50% 35%,#12301f 0%,#07130D 70%);--poster-color:transparent}
.arbtn{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);font:800 16px var(--ar);color:#07130D;background:var(--lime);border:0;border-radius:99px;padding:13px 26px;box-shadow:0 8px 24px rgba(0,0,0,.45);white-space:nowrap;cursor:pointer}
.info{padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--panel);font-size:13.5px}
.info ol{margin:0;padding-inline-start:20px}.info p{margin:8px 0 0;color:var(--mut);font-size:12px}
.noar{display:none;margin-top:8px;color:#E6B450;font-size:12.5px}
#prog{position:absolute;left:0;right:0;top:0;height:3px;background:var(--lime);transform-origin:left;transform:scaleX(0);transition:transform .2s}
</style>
</head>
<body>
<header><span class="brand"><b>SMART</b> Lab</span><div class="ttl"><span data-ar="مركز الروبوتات الصناعية على طاولتك" data-en="The robotics center on your table"></span><small data-ar="معامل الأتمتة الصناعية · كلية الهندسة · جامعة الملك عبدالعزيز" data-en="Industrial Automation Labs · Faculty of Engineering · KAU"></small></div><button id="lang" type="button">English</button></header>
<model-viewer id="mv" src="models/center.glb" alt="3D model of the industrial robotics center" ar ar-modes="webxr scene-viewer quick-look" ar-scale="auto" ar-placement="floor" camera-controls touch-action="pan-y" autoplay animation-name="cycle" shadow-intensity="1" shadow-softness="0.9" exposure="1.05" camera-orbit="-35deg 62deg 105%" min-camera-orbit="auto 15deg auto" max-camera-orbit="auto 88deg auto" interaction-prompt="auto" loading="eager">
  <button slot="ar-button" class="arbtn" data-ar="ضعه على الطاولة" data-en="Place it on the table"></button>
  <div slot="progress-bar" id="prog"></div>
</model-viewer>
<section class="info">
  <ol><li data-ar="اضغط «ضعه على الطاولة» واسمح باستخدام الكاميرا." data-en="Tap “Place it on the table” and allow the camera."></li>
  <li data-ar="وجّه الجوال لسطح الطاولة وحرّكه ببطء حتى يظهر النموذج." data-en="Point the phone at the table and move it slowly until the model appears."></li>
  <li data-ar="لُفّ حوله وقرّب، وكبّره أو صغّره بإصبعين." data-en="Walk around it, move closer, and pinch to resize."></li></ol>
  <p data-ar="نموذج تصوّري بمقياس 1:25. على بعض أجهزة آيفون يظهر النموذج ثابتًا بدون حركة." data-en="Concept model at 1:25 scale. On some iPhones the model appears static, without animation."></p>
  <div class="noar" id="noar" data-ar="هذا الجهاز لا يدعم الواقع المعزز. تقدر تلف النموذج هنا بإصبعك." data-en="This device does not support AR. You can still rotate the model here."></div>
</section>
<script>
(function(){var lang=(new URLSearchParams(location.search).get('lang')==='en')?'en':'ar';
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(function(e){e.textContent=e.getAttribute('data-'+lang)});document.getElementById('lang').textContent=lang==='ar'?'English':'العربية'}
document.getElementById('lang').onclick=function(){lang=lang==='ar'?'en':'ar';apply()};apply();
var mv=document.getElementById('mv');mv.addEventListener('progress',function(e){document.getElementById('prog').style.transform='scaleX('+e.detail.totalProgress+')';if(e.detail.totalProgress>=1)document.getElementById('prog').style.opacity=0});
mv.addEventListener('load',function(){if(!mv.canActivateAR)document.getElementById('noar').style.display='block'});})();
</script>
</body>
</html>
