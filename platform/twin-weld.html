<style>
/* Layout: app grid = header / 3D stage + side panel (stage above, panel below on phones).
   Single dark control-room look in KAU greens; STARK appears only as the student-team tag (no authorship claim until the students work on it). */
:root{--bg:#07130D;--panel:#0B1E15;--panel2:#10291C;--line:#1F4430;--fg:#F2F7ED;--mut:#A7C2B2;--g:#2BB673;--lime:#86C242;--gold:#C9A86A;

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.55 var(--ar);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 396px;grid-template-rows:auto minmax(0,1fr);padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
.top{grid-column:1/-1;display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
.brand{font-weight:800;font-size:15px;background:#055934;border-radius:8px;padding:3px 10px;direction:ltr;white-space:nowrap}
.brand b{color:var(--lime)}
.ttl{font-weight:800;font-size:14.5px;line-height:1.3;min-width:0}
.ttl small{display:block;font-weight:400;font-size:11.5px;color:var(--mut)}
.sp{flex:1}
.chip{font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--panel2);border-radius:99px;padding:3px 11px;white-space:nowrap}
.chip.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;direction:ltr}
.chip.sim{color:var(--gold);border-color:#5d4f2e;background:#231d0f}
.chip.run{color:#07130D;background:var(--g);border-color:var(--g)}
.chip.warn{color:#07130D;background:var(--amber);border-color:var(--amber)}
.chip.stop{color:#07130D;background:var(--red);border-color:var(--red)}
.stark{font-size:11px;font-weight:600;color:#E8B04A;background:#7A0C14;border-radius:99px;padding:3px 10px;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--g)}
.btn.pri{background:var(--g);border-color:var(--g);color:#07130D}
.btn.ghost{padding:5px 12px;border-radius:99px;font-size:12px}
.btn.wide{width:100%;margin-top:12px;border-color:#3d6b52}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.cams{position:absolute;top:10px;inset-inline-start:10px;display:flex;gap:6px;flex-wrap:wrap}
.cams button{border:1px solid var(--line);background:rgba(11,30,21,.86);border-radius:99px;padding:5px 12px;font-size:12px;font-weight:600;color:var(--mut)}
.cams button.on{background:var(--lime);border-color:var(--lime);color:#07130D}
.alarm{position:absolute;top:10px;inset-inline-end:10px;max-width:min(340px,70%);background:rgba(58,18,16,.94);border:1px solid var(--red);border-radius:12px;padding:8px 12px;font-size:12.5px;line-height:1.5}
.alarm b{color:var(--red);display:block;font-size:11px;letter-spacing:.04em}
.alarm div+div{margin-top:3px}
.toast{position:absolute;top:52px;left:50%;transform:translateX(-50%);background:rgba(11,30,21,.94);border:1px solid var(--line);border-radius:99px;padding:6px 16px;font-size:12.5px;max-width:92%;text-align:center}
.hud{position:absolute;bottom:12px;inset-inline-start:12px;display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;max-width:calc(100% - 24px)}
.chartbox{background:rgba(11,30,21,.88);border:1px solid var(--line);border-radius:12px;padding:6px 8px 4px;direction:ltr}
#chart{display:block;width:300px;height:92px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(74px,1fr));gap:6px;direction:ltr}
.tile{background:rgba(11,30,21,.88);border:1px solid var(--line);border-radius:10px;padding:5px 9px;min-width:0}
.tile span{display:block;font-size:10.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .sm{display:none}
.tile b{font:600 17px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.tile i{font-style:normal;font-size:10.5px;color:var(--mut);margin-inline-start:3px}
.panel{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--panel);border-inline-start:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:none}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;font-size:12.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.tabs button.on{color:var(--fg);border-bottom-color:var(--lime)}
.panes{flex:1;min-height:0;overflow:auto;padding-block:14px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-inline-start:auto;direction:ltr}
.seg button{background:var(--panel2);border:0;padding:8px 11px;font:600 12.5px var(--mono);color:var(--mut)}
.seg button.on{background:var(--lime);color:#07130D}
.ctl{margin-bottom:11px}
.ctl label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut);margin-bottom:2px}
.ctl label b{font:600 13px var(--mono);color:var(--fg);direction:ltr}
input[type=range]{width:100%;accent-color:var(--lime);height:22px;margin:0}
.row2{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:4px 0 14px;font-size:12.5px}
.sw{display:flex;gap:8px;align-items:center}
.sw input{width:17px;height:17px;accent-color:var(--lime)}
select,input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;direction:ltr}
.sel{display:flex;gap:8px;align-items:center}
.pred{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.pred h4,.h4{margin:0 0 8px;font-size:12.5px;font-weight:600;color:var(--lime)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 10px}
.pgrid div span{display:block;font-size:10.5px;color:var(--mut)}
.pgrid div b{font:600 14px var(--mono);direction:ltr;display:inline-block}
.pgrid div b small{font-size:10px;color:var(--mut);font-weight:400}
.verd{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.verd span{font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 10px}
.v-ok{background:#0f3a25;color:var(--g)}.v-bad{background:#3a1512;color:var(--red)}.v-warn{background:#3a2c0e;color:var(--amber)}
.fine{font-size:11.5px;color:var(--mut);margin:10px 0 0}
#map{display:block;width:100%;height:292px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;direction:ltr}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:9px 0}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.info{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:12.5px}
.info table{width:100%;border-collapse:collapse;margin-top:6px}
.info td{padding:3px 0;border-top:1px solid var(--line)}
.info td:last-child{text-align:end;font-family:var(--mono);direction:ltr}
.prog{font:12px/1.75 var(--mono);direction:ltr;text-align:left;background:#06100b;border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre;overflow:auto;margin:0}
.prog .cur{color:#07130D;background:var(--lime);border-radius:4px}
.prog .dim{color:#5f7d6c}
.fault{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.fault.on{border-color:var(--red)}
.fault input{width:17px;height:17px;margin-top:3px;accent-color:var(--red);flex:none}
.fault b{font-size:13px}
.fault p{margin:2px 0 0;font-size:11.5px;color:var(--mut)}
.bar{height:8px;border-radius:99px;background:#06100b;border:1px solid var(--line);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--g)}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.k{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
.k span{display:block;font-size:11px;color:var(--mut)}
.k b{font:600 18px/1.3 var(--mono);direction:ltr;display:inline-block}
.k b small{font-size:11px;color:var(--mut);font-weight:400}
.cmp{margin-top:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
.cmp .in{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px}
.cmp input{width:76px;text-align:center;direction:ltr}
.cmp .res{margin-top:8px;font-weight:600;color:var(--lime);font-size:13px}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 42svh minmax(0,1fr)}
  .panel{border-inline-start:0;border-top:1px solid var(--line)}
  .ttl small,.stark,#chBeam,.sp{display:none}
  .top{gap:6px 8px;padding-block:7px}
  .ttl{flex:1 1 calc(100% - 210px);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand{font-size:13px}
  .chip{font-size:11px;padding:2px 9px}
  #lang{order:3}.chip.sim{order:4}#chState{order:5}#chClock{order:6}
  .chartbox{display:none}
  .hud{bottom:8px;inset-inline-start:8px;inset-inline-end:8px;max-width:none}
  .tiles{grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;width:100%}
  .tile{padding:3px 6px}.tile b{font-size:12.5px}.tile span{font-size:9.5px}.tile i,.tile .lg{display:none}.tile .sm{display:block}
  .cams{top:6px;inset-inline-start:6px}.cams button{padding:4px 9px;font-size:11px}
  .alarm{top:36px;inset-inline-end:6px;font-size:11.5px}
  .toast{top:auto;bottom:52px}
  #map{height:250px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="gate" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#07130D;color:#F2F7ED;font:15px/1.6 'Alexandria',Tahoma,Arial,sans-serif;padding:16px">
<form id="gateF" style="width:100%;max-width:340px;background:#0B1E15;border:1px solid #1F4430;border-radius:16px;padding:24px;text-align:center" autocomplete="off">
<div style="font-weight:800;font-size:18px;direction:ltr"><span style="color:#86C242">SMART</span> Lab</div>
<p style="margin:8px 0 16px;color:#A7C2B2">أدخل رمز الدخول · Enter the access code</p>
<input id="gateI" type="password" autocapitalize="off" style="width:100%;box-sizing:border-box;font-size:16px;padding:12px;border-radius:10px;border:1px solid #1F4430;background:#07130D;color:#F2F7ED;text-align:center" aria-label="Access code">
<button style="margin-top:12px;width:100%;font-weight:700;font-size:15px;font-family:inherit;padding:12px;border:0;border-radius:10px;background:#86C242;color:#07130D;cursor:pointer">دخول · Enter</button>
<p id="gateE" style="margin:10px 0 0;color:#EC7A72;min-height:1.6em"></p>
</form></div>
<script>
(function(){var H="5e917cde28aac94a1a17535db4ad9ec87f5676bdc02d82af28c3f1c04514600a",K="smartlab-pass";
function open(){var g=document.getElementById("gate");if(g)g.remove();window.__gateOpen=true;document.dispatchEvent(new Event("gate-open"))}
try{if(localStorage.getItem(K)===H){open();return}}catch(e){}
async function sha(s){var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
document.getElementById("gateF").addEventListener("submit",async function(e){e.preventDefault();var v=document.getElementById("gateI").value.trim().toLowerCase();
 if(await sha(v)===H){try{localStorage.setItem(K,H)}catch(e){}open()}else{document.getElementById("gateE").textContent="الرمز غير صحيح · Wrong code"}});
setTimeout(function(){var i=document.getElementById("gateI");if(i)i.focus()},50)})();
</script>

function drawMap(){const c=$('#map'),W=c.clientWidth,Hh=c.clientHeight;if(!W)return;const dpr=Math.min(devicePixelRatio,2);if(c.width!==Math.round(W*dpr)){c.width=Math.round(W*dpr);c.height=Math.round(Hh*dpr)}
  const g=c.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,W,Hh);hit.length=0;const pad=16,fh=(Hh-2*pad-24)/2;
  ['A','B'].forEach((f,fi)=>{const y0=pad+fi*(fh+24)+16,X=x=>pad+x/Lb*(W-2*pad),Z=z=>y0+(z-zS)/.94*(fh-18);
    g.fillStyle='#A7C2B2';g.font='600 11.5px Alexandria, Arial';g.textAlign='left';g.textBaseline='alphabetic';g.fillText(t(f==='A'?'faceA':'faceB')+(S.face===f&&S.step&&S.step.k!=='load'?'  ●':''),pad,y0-6);
    g.beginPath();g.moveTo(X(0),Z(zS));g.lineTo(X(Lb),Z(zS));g.lineTo(X(Lb),Z(zT(Lb)));g.lineTo(X(0),Z(zT(0)));g.closePath();g.fillStyle='#0b1e15';g.fill();g.strokeStyle='#3d6b52';g.lineWidth=2;g.stroke();
    SEAMS.forEach(s=>{if(s.face!==f)return;const col=seamCol(s),o=s.sx*3.4,x=X(s.p0.x)+o;g.strokeStyle=col;g.fillStyle=col;g.lineCap='round';
      if(s.kind==='web'){g.lineWidth=s===S.sel?5:3;g.beginPath();g.moveTo(x,Z(s.p0.z));g.lineTo(x,Z(s.p1.z));g.stroke();hit.push({s,x,y0:Z(s.p0.z),y1:Z(s.p1.z)})}
      else{const y=Z(s.p0.z)+(s.tag.endsWith('F1')?5:-5);g.beginPath();g.arc(x,y,s===S.sel?4.6:3.1,0,7);g.fill();hit.push({s,x,y0:y-4,y1:y+4})}})})}
$('#map').onclick=e=>{const r=e.currentTarget.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;let best=null,bd=18;hit.forEach(h=>{const dy=y<h.y0?h.y0-y:y>h.y1?y-h.y1:0,d=Math.hypot(x-h.x,dy);if(d<bd){bd=d;best=h.s}});if(best){S.sel=best;S.mapDirty=true;uiSlow()}};
function seamInfo(){const s=S.sel,e=$('#seamInfo');if(!s){e.innerHTML=`<span style="color:var(--mut)">${t('pick')}</span>`;return}const r=s.rec;
  const res=s.st==='pend'?t('r_pend'):s.st==='arc'?t('r_arc'):s.st==='done'?(s.pred?t('lg_risk')+': '+t('d_'+s.pred):t('r_wait')):s.st==='ok'?t('r_ok'):t('lg_ng')+': '+t('d_'+r.defect);
  const col=s.st==='ok'?'var(--g)':s.st==='ng'?'var(--red)':s.pred?'var(--amber)':'var(--fg)';
  e.innerHTML=`<b>${t('rec')} ${s.id}</b> <span style="color:var(--mut);font-family:var(--mono)">${s.tag} · ${(s.len*1000).toFixed(0)} mm</span><table>
   <tr><td>${t('result')}</td><td style="font-family:var(--ar);color:${col};direction:inherit">${res}</td></tr>${r?`
   <tr><td>${t('cur')} / ${t('u')}</td><td>${r.I.toFixed(0)} A / ${r.U.toFixed(1)} V</td></tr><tr><td>${t('ts')}</td><td>${r.ts.toFixed(0)} cm/min</td></tr><tr><td>${t('heat')}</td><td>${r.Q.toFixed(2)} kJ/mm</td></tr>
   <tr><td>${t('leg')}</td><td>${r.leg.toFixed(1)} mm</td></tr>${s.st==='ok'||s.st==='ng'?`<tr><td>${t('meas')}</td><td>${r.meas.toFixed(1)} mm</td></tr>`:''}

    [`MOVJ  P_${q.id}_APP`,`${P.track?'SENSE':'NOP  '} ${q.tag}${q.sh?'  DX=+6.0':''}`,`ARCON WPS-F${P.target} I=${m.I.toFixed(0)}A U=${P.u.toFixed(1)}V`,`MOVL  P_${q.id}_END V=${P.ts}cm/min`,`ARCOF CRATER=0.4s`].forEach((ln,j)=>{
      const cur=k===i&&j===cl;out.push(`<span class="${cur?'cur':k===i?'':'dim'}">${cur?'▶':' '} ${n}${j} ${ln}</span>`)})}
  e.innerHTML=out.join('\n')}
function kpiRender(){const arcPct=K.tCyc>0?K.tArcB/K.tCyc*100:0,cyc=K.lastCyc||estCycle(),insp=K.ok+K.ng,fpy=insp?K.ok/insp*100:null,m=model(P,F);

  lampM.g.color.setHex(S.running&&!S.estop?0x35e07f:0x0f3a22);lampM.a.color.setHex(!S.running&&!S.estop?0xf0b63a:0x4a3a12);lampM.r.color.setHex(S.estop?0xff4a3d:0x4a1512);curtainMat.opacity=F.cur?.95:.14;
