<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>STARK Mission Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;600;700;800&family=Unbounded:wght@700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --g1:#7A0C14; --g2:#A50F1A; --g3:#E8B04A; --g4:#EFE0CC; --g5:#FBF6EF;
  --t1:#1A0E0F; --t2:#E8B04A; --n1:#1E1214; --n2:#6B5A55; --n3:#9C8A82; --n4:#DCCDBD;
  --gold:#A8730F; --maroon:#C62828; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Alexandria',system-ui,sans-serif}
body{background:var(--g5);color:var(--n1);padding-bottom:84px}
header{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
header h1{font-size:17px;font-weight:800;letter-spacing:.3px}
header .sub{font-size:11px;opacity:.85;font-weight:300}
.langbtn{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer}
main{max-width:1080px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--n4);display:flex;justify-content:space-around;z-index:60;max-width:1080px;margin:0 auto;left:0;right:0}
nav button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:11px;color:var(--n2);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--g1);font-weight:700}
nav button .ic{font-size:20px;line-height:1}
.card{background:#fff;border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(29,41,33,.08)}
.card h2{font-size:15px;color:var(--g1);font-weight:800;margin-bottom:10px}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.kpi{background:linear-gradient(160deg,#fff,var(--g5));border:1px solid var(--g4);border-radius:var(--r);padding:12px;text-align:center}
.kpi .v{font-size:26px;font-weight:800;color:var(--g1)}
.kpi .l{font-size:11px;color:var(--n2)}
.kpi.warn .v{color:var(--gold)} .kpi.bad .v{color:var(--maroon)}
input,select,textarea{width:100%;padding:10px 12px;border:1.5px solid var(--n4);border-radius:10px;font-size:14px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g2)}
label.f{font-size:11.5px;color:var(--n2);font-weight:600;display:block;margin:10px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--g1);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:13.5px;font-weight:700;cursor:pointer}
.btn.sec{background:#fff;color:var(--g1);border:1.5px solid var(--g2)}
.btn.warn{background:var(--gold)} .btn.dang{background:var(--maroon)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--g1);color:#fff;padding:8px 6px;font-weight:600;font-size:11.5px;text-align:start}
td{padding:8px 6px;border-bottom:1px solid var(--g4);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--g5)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:10.5px;font-weight:700}
.tg-ok{background:#dff0e3;color:#1f6b3e} .tg-out{background:#f7ead0;color:var(--gold)}
.tg-mnt{background:#f8dedb;color:var(--maroon)} .tg-miss{background:#eee;color:var(--n2)}
.modal{position:fixed;inset:0;background:rgba(26,14,15,.62);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:640px;max-height:88vh;overflow:auto;padding:20px}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:20px}}
.sheet h3{color:var(--g1);font-size:16px;font-weight:800;margin-bottom:8px}
.itemhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.qrbox{background:var(--g5);border:1px dashed var(--g3);border-radius:12px;padding:10px;text-align:center}
.lblcanvas{border:1px solid var(--n4);border-radius:8px;max-width:100%;height:auto;background:#fff}
.hint{font-size:11px;color:var(--n3);margin-top:4px}
.pill{display:inline-block;background:var(--g5);border:1px solid var(--g4);border-radius:20px;padding:4px 12px;font-size:11.5px;margin:2px;cursor:pointer}
.pill.on{background:var(--g2);color:#fff;border-color:var(--g2)}
#scanbox{width:100%;max-width:420px;margin:0 auto;border-radius:14px;overflow:hidden}
.empty{text-align:center;color:var(--n3);padding:28px;font-size:13px}
.logrow{font-size:12px;padding:8px 0;border-bottom:1px solid var(--g4)}
.logrow .t{color:var(--n3);font-size:10.5px}
.searchwrap{position:sticky;top:60px;z-index:40;background:var(--g5);padding:6px 0}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
h4.sec{font-size:12.5px;color:var(--t1);font-weight:800;margin:14px 0 6px}
.chk{width:16px;height:16px}
footer{Text-align:center;font-size:10px;color:var(--n3);padding:10px;text-align:center}

/* ===== STARK skin ===== */
header{background:var(--g1)}
header .brand{display:flex;align-items:center;gap:12px;min-width:0}
header svg.wm{height:26px;width:auto;flex:none;display:block}
header h1{font-size:13px;font-weight:700;letter-spacing:.2px}
header .sub{font-size:10.5px}
.kpi{background:#fff;border-color:var(--g4)} .kpi .v{color:var(--n1);font-family:'Unbounded','Alexandria',sans-serif;font-weight:700;font-size:24px}
.kpi.warn .v{color:var(--gold)} .kpi.bad .v{color:var(--maroon)}
.card h2{font-family:'Unbounded','Alexandria',sans-serif;font-weight:700;font-size:13.5px}
nav button.on{color:var(--g1)} nav button.on .ic{transform:translateY(-1px)}
.tg-ok{background:#dff0e3;color:#1f6b3e}
.btn.sec{border-color:var(--g1)}
body.intern .adm{display:none!important}
.hero{background:var(--g1);color:#fff;border-radius:var(--r);padding:18px;margin-bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.hero .hi{font-family:'Unbounded','Alexandria',sans-serif;font-weight:700;font-size:17px;color:var(--g3)}
.hero .tl{font-size:12px;opacity:.85}
.task{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--g4);cursor:pointer}
.task:last-child{border-bottom:0}
.task .tt{font-weight:700;font-size:13.5px} .task .tm{font-size:11px;color:var(--n3);margin-top:2px}
.task .late{color:var(--maroon);font-weight:700}
.bar{height:8px;background:var(--g4);border-radius:8px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:#2e7d4f;border-radius:8px}
.rd{padding:8px 0;border-bottom:1px solid var(--g4);font-size:12.5px} .rd:last-child{border-bottom:0}
.rd .rl{display:flex;justify-content:space-between;gap:8px}
.tablewrap{overflow-x:auto}
.lock{max-width:420px;margin:60px auto;text-align:center}
.lock .big{font-family:'Unbounded','Alexandria',sans-serif;font-weight:900;font-size:18px;color:var(--g1);margin-bottom:12px}

/* ===== STARK platform v2 ===== */
nav{overflow-x:auto} nav button{min-width:58px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.tile{background:#fff;border:1px solid var(--g4);border-radius:var(--r);padding:16px 12px;text-align:center;cursor:pointer;font-weight:700;font-size:13px;color:var(--n1);font-family:inherit}
.tile .ic{font-size:26px;display:block;margin-bottom:6px}
.tile:active{background:var(--g5)}
.kb{display:grid;grid-template-columns:repeat(4,minmax(236px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--g5);border:1px solid var(--g4);border-radius:var(--r);padding:10px;min-width:0;align-self:start}
.kcol h4{font-size:12px;margin:0 0 8px;display:flex;justify-content:space-between;color:var(--n2)}
.kcard{background:#fff;border:1px solid var(--g4);border-radius:10px;padding:10px;margin-bottom:8px;cursor:pointer;border-inline-start:4px solid var(--g3)}
.kcard.late{border-inline-start-color:var(--maroon)}
.kcard .tt{font-weight:700;font-size:13px;line-height:1.35}
.kcard .tm{font-size:11px;color:var(--n3);margin-top:4px}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.skc{border:1px solid var(--g4);border-radius:12px;padding:12px;background:#fff;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
.skc .ic{font-size:22px} .skc b{font-size:13px;line-height:1.3}
.skc.ok{background:#fff8ea;border-color:var(--g3)} .skc.lk{opacity:.8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2e7d4f;margin-inline-end:6px;box-shadow:0 0 0 3px #dff0e3}
.dot.off{background:var(--n4);box-shadow:none}
.rowx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--g4)}
.rowx:last-child{border-bottom:0} .rowx>div:first-child{min-width:0}
.rowx .tt{font-weight:700;font-size:13.5px} .rowx .tm{font-size:11px;color:var(--n3);margin-top:2px}
.pbar{height:8px;background:var(--g4);border-radius:8px;overflow:hidden;margin-top:6px} .pbar i{display:block;height:100%;background:var(--g1);border-radius:8px}
.shot{border:2px dashed var(--n4);border-radius:var(--r);overflow:hidden;margin:10px 0;background:var(--g5)}
.shot canvas{display:block;width:100%;height:auto}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.shots.one{grid-template-columns:1fr}
.shots .ph{position:relative;border:2px solid var(--g4);border-radius:var(--r);overflow:hidden;background:var(--g5)}
.shots .ph canvas{display:block;width:100%;height:auto;cursor:zoom-in}
.shots .ph .no{position:absolute;top:6px;inset-inline-start:6px;background:#1A0E0F;color:#fff;font:800 12px Alexandria,sans-serif;border-radius:999px;padding:2px 8px}
.shots .ph .x{position:absolute;top:6px;inset-inline-end:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(26,14,15,.75);color:#fff;font-size:14px;cursor:pointer}
.shots.big{grid-template-columns:1fr}
.more{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--g5);border:1px dashed var(--g3);font-size:13px;line-height:1.7}
.stepimg{display:inline-block;font-size:11px;font-weight:700;background:var(--g4);color:var(--g1);border-radius:999px;padding:0 7px;margin-inline-start:6px}
.drop{display:block;padding:38px 12px;text-align:center;font-weight:700;color:var(--g1);cursor:pointer;font-size:14px}
.drop small{display:block;font-weight:400;color:var(--n3);margin-top:4px}
.safety{background:#fdecea;border:1px solid #f1b5ae;border-radius:12px;padding:12px;font-size:13px;color:#8a1c14;margin-bottom:10px}
.safety b{display:block;margin-bottom:4px}
.steps2{list-style:none;margin:10px 0 0;padding:0;counter-reset:st}
.steps2 li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--g4);font-size:13.5px;line-height:1.6}
.steps2 li::before{counter-increment:st;content:counter(st);width:26px;height:26px;border-radius:50%;background:var(--g3);color:var(--t1);font-weight:800;display:grid;place-items:center;font-size:12px}
.conf{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px}
.conf.high{background:#dff0e3;color:#1f6b3e}.conf.medium{background:#f7ead0;color:var(--gold)}.conf.low{background:#f8dedb;color:var(--maroon)}
.chat{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.bub{max-width:92%;border-radius:16px;padding:12px 14px;font-size:14px;line-height:1.6}
.bub.u{align-self:flex-end;background:var(--g1);color:#fff;border-end-end-radius:4px}
.bub.a{align-self:flex-start;background:#fff;border:1px solid var(--g4);border-end-start-radius:4px;width:92%}
.askbar{position:sticky;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 -6px 18px rgba(26,14,15,.08)}
.typing i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--n3);margin-inline-end:3px;animation:tp 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,100%{opacity:.25}50%{opacity:1}}
.demo{background:#f7ead0;border-radius:10px;padding:8px 10px;font-size:12px;color:#6b4a08;margin-bottom:10px}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--g4);cursor:pointer;flex:none}
.rec{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px} @media(max-width:520px){.rec{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media print{header,nav,#main{display:none!important}.modal{position:static!important;background:#fff!important;display:block!important}.sheet{max-height:none!important;max-width:none!important}.noprint{display:none!important}}

/* ===== STARK cloud ===== */
.gate{max-width:420px;margin:56px auto;text-align:center;padding:28px 22px}
.gate .big{font-family:'Unbounded','Alexandria',sans-serif;font-weight:900;font-size:20px;color:var(--g1);margin-bottom:10px}
.gate p{font-size:13.5px;color:var(--n2);line-height:1.7;margin:0 0 18px}
.gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;border-radius:999px;padding:11px 20px;font:600 14px Alexandria,sans-serif;cursor:pointer}
.gbtn:hover{background:#f6f7f8}
.gbtn svg{width:18px;height:18px}
.who{display:flex;align-items:center;gap:10px}.who img{width:34px;height:34px;border-radius:50%}
.role{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--g4);color:var(--g1)}
</style>
</head>

db.bookings=db.bookings||[];db.rev=db.rev||0;
db.containers=db.containers||[];db.seqC=db.seqC||1;
db.docs=db.docs||[];db.seqK=db.seqK||1;
if(!db.migC){
  db.items.forEach(x=>{
    const m=/Cabinet (C\d+)/i.exec(x.notes||'');
    if(m){const nm=m[1].toUpperCase();
      let c=db.containers.find(k=>k.name===nm&&k.location===x.location);
      if(!c){c={id:'CAB-'+nm,name:nm,type:'cabinet',location:x.location,notes:'Auto-created from 2026 inventory import'};db.containers.push(c);}
      x.container=c.id;}
  });

}

function save(){if(!applying)db.rev=(db.rev||0)+1;localStorage.setItem('sml_db',JSON.stringify(db));if(!applying)cloudPush();}
const pad=n=>('0000'+n).slice(-4);

function render(){
  DB2();
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  document.getElementById('hTitle').textContent=t('title');
  document.getElementById('hSub').textContent=t('sub');
  document.querySelector('.langbtn').textContent=lang==='ar'?'EN':'ع';
  renderNav();
  const m=document.getElementById('main');
  if(!unlocked){document.getElementById('nav').innerHTML='';m.innerHTML=`<div class="card lock"><div class="big">🔒 ${t('locked')}</div><button class="btn" onclick="unlockDir()">${t('unlock')}</button></div>`;return}
  if(!authed()){document.getElementById('nav').innerHTML='';m.innerHTML=vLogin();return}
  if(tab==='dash')m.innerHTML=vDash();
  else if(tab==='ask'){m.innerHTML=vAsk();askDraw()}
  else if(tab==='lab')m.innerHTML=vLab();
  else if(tab==='me')m.innerHTML=vMe();
  else if(tab==='people')m.innerHTML=vPeople();
  else if(tab==='proj')m.innerHTML=vProj();
  else if(tab==='tasks')m.innerHTML=vTasks();
  else if(tab==='items')m.innerHTML=vItems();
  else if(tab==='scan'){m.innerHTML=vScan()}
  else if(tab==='labels')m.innerHTML=vLabels();
  else if(tab==='book')m.innerHTML=vBook();
  else if(tab==='kb')m.innerHTML=vKb();
  else if(tab==='logs')m.innerHTML=vLogs();
  else m.innerHTML=vData();
  if(tab==='labels')drawSelected();
}
function stTag(s){const map={ok:['tg-ok','stOk'],out:['tg-out','stOut'],mnt:['tg-mnt','stMnt'],miss:['tg-miss','stMiss']};const[m,k]=map[s]||map.ok;return `<span class="tag ${m}">${t(k)}</span>`}

function vDashInv(){
  const i=db.items;
  const c={ok:0,out:0,mnt:0,miss:0};i.forEach(x=>c[x.status]=(c[x.status]||0)+1);
  const low=i.filter(x=>x.category==='Consumable'&&+x.qty<=+x.minQty);
  const outL=i.filter(x=>x.status==='out');
  const due=i.map(x=>({x,nd:nextDue(x)})).filter(o=>o.nd&&(o.nd-Date.now())<7*864e5).sort((a,b)=>a.nd-b.nd);
  const tb=db.bookings.filter(b=>b.date===todayStr()).sort((a,b)=>a.start.localeCompare(b.start));
  return `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="kpi"><div class="v">${i.length}</div><div class="l">${t('total')}</div></div>
    <div class="kpi"><div class="v">${c.ok||0}</div><div class="l">${t('avail')}</div></div>
    <div class="kpi warn"><div class="v">${c.out||0}</div><div class="l">${t('out')}</div></div>
    <div class="kpi bad"><div class="v">${(c.mnt||0)+(c.miss||0)}</div><div class="l">${t('mnt')} / ${t('stMiss')}</div></div>
  </div>
  ${due.length?`<div class="card"><h2>🔧 ${t('maintDue')}</h2>${due.map(o=>`<div class="logrow click" onclick="openItem('${o.x.id}')">${esc(o.x.name)} — <b style="color:${o.nd<new Date()?'var(--maroon)':'var(--gold)'}">${o.nd.toISOString().slice(0,10)}${o.nd<new Date()?' · '+t('overdue'):''}</b></div>`).join('')}</div>`:''}
  ${tb.length?`<div class="card"><h2>📅 ${t('todayB')}</h2>${tb.map(b=>`<div class="logrow"><b>${b.start}–${b.end}</b> ${esc(b.title)} <span class="hint">· ${esc(b.resource)} · ${esc(b.by)}</span></div>`).join('')}</div>`:''}
  ${low.length?`<div class="card"><h2>⚠️ ${t('low')}</h2>${low.map(x=>`<div class="logrow">${esc(x.name)} — ${x.qty}/${x.minQty}</div>`).join('')}</div>`:''}
  ${outL.length?`<div class="card"><h2>🤝 ${t('out')}</h2>${outL.map(x=>`<div class="logrow click" onclick="openItem('${x.id}')">${esc(x.name)} → <b>${esc(x.custody?.to||'')}</b> <span class="t">${t('since')} ${fdate(x.custody?.date)}</span></div>`).join('')}</div>`:''}
  ${db.docs.length?`<div class="card"><h2>📚 ${t('kbRecent')}</h2>${db.docs.slice().sort((a,b)=>(b.updated||'').localeCompare(a.updated||'')).slice(0,3).map(x=>`<div class="logrow click" onclick="openDoc('${x.id}')">${dLabel(x.type)} <b>${esc(x.title)}</b><div class="t">${esc(x.author||'—')} · ${fdate(x.updated)}</div></div>`).join('')}</div>`:''}
  <div class="card"><h2>${t('recent')}</h2>${db.logs.length?db.logs.slice(0,8).map(lg=>`<div class="logrow"><b>${esc(lg.itemId)}</b> — ${esc(lg.action)} ${esc(lg.detail)}<div class="t">${fdate(lg.t)}${lg.who?' · '+esc(lg.who):''}</div></div>`).join(''):`<div class="empty">${t('noLogs')}</div>`}</div>`;
}
let q='', iview='items';
function vItems(){
  if(iview==='containers')return vConts();
  const list=db.items.filter(x=>{
    const s=(x.id+' '+x.name+' '+(x.nameAr||'')+' '+x.location+' '+(x.serial||'')+' '+(x.container||'')).toLowerCase();
    return s.includes(q.toLowerCase());
  });
  return `
  <div class="searchwrap row">
    <input style="flex:1" placeholder="${t('search')}" value="${esc(q)}" oninput="q=this.value;render()">

  <div class="row" style="margin:0 0 8px">
    <span class="pill on">${t('itemsLbl')} (${db.items.length})</span>
    <span class="pill" onclick="iview='containers';render()">📦 ${t('contLbl')} (${db.containers.length})</span>
  </div>
  <div class="card" style="overflow-x:auto">
  ${list.length?`<table><tr><th>ID</th><th>${t('name')}</th><th>${t('loc')}</th><th>${t('status')}</th></tr>
   ${list.map(x=>`<tr class="click" onclick="openItem('${x.id}')"><td><b>${x.id}</b></td><td>${esc(x.name)}${x.nameAr?`<div class="t" style="font-size:10px;color:var(--n3)">${esc(x.nameAr)}</div>`:''}</td><td>${esc(x.location.split('–')[0].trim())}${x.container?`<div class="t" style="font-size:10px;color:var(--n3)">📦 ${x.container}</div>`:''}</td><td>${stTag(x.status)}</td></tr>`).join('')}</table>`
   :`<div class="empty">—</div>`}
  </div>`;
}

}

  return `<div class="card"><h2>${t('logs')}</h2>${db.logs.length?db.logs.map(lg=>`<div class="logrow"><b>${esc(lg.itemId)}</b> — ${esc(lg.action)} ${esc(lg.detail)}<div class="t">${fdate(lg.t)}${lg.who?' · '+esc(lg.who):''}</div></div>`).join(''):`<div class="empty">${t('noLogs')}</div>`}</div>`;

function addDays(ds,n){const d=new Date(ds);d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function saveBk(){
  const v=k=>document.getElementById(k).value.trim();
  const ti=v('bk_t'),r=v('bk_r'),dt=v('bk_d'),s=v('bk_s'),e=v('bk_e'),w=+v('bk_w')||0,by=v('bk_b');
  if(!ti||!dt||!s||!e||e<=s)return alert(t('need'));
  const news=[];
  for(let k=0;k<=w;k++){
    const dd=addDays(dt,7*k);
    const clash=db.bookings.some(b=>b.resource===r&&b.date===dd&&!(e<=b.start||s>=b.end));
    if(clash)return alert(t('conflict')+' ('+dd+')');
    news.push({id:'B'+Date.now().toString(36)+k,title:ti,resource:r,date:dd,start:s,end:e,by});
  }
  db.bookings.push(...news);log(r,'📅 '+ti,news[0].date+(w?(' ×'+(w+1)):'')+' '+s);save();closeM();render();
}

/* ================= cloud sync (Firebase) ================= */
let fbh={},applying=false,pushT=null,adminUntil=0;
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;for(const ch of s)h=((h*33)^ch.charCodeAt(0))>>>0;return 'djb2:'+h.toString(16);}
}
async function adminDo(fn){
  if(Date.now()<adminUntil)return fn();
  if(!db.adminHash){
    const p1=prompt(t('pinSetup'));if(!p1)return;
    const p2=prompt(t('pinConfirm'));if(p1!==p2)return alert(t('pinMismatch'));
    db.adminHash=await sha(p1);save();adminUntil=Date.now()+15*60*1000;
    alert(t('pinSaved'));return fn();
  }
  const p=prompt(t('pinAsk'));if(p===null)return;
  if(await sha(p)===db.adminHash){adminUntil=Date.now()+15*60*1000;fn();}
  else alert(t('pinWrong'));
}
function dailySnap(){
  const today=new Date().toISOString().slice(0,10);
  try{
    if(cfg.lastLocalSnap!==today){
      localStorage.setItem('sml_snap_local',JSON.stringify({d:today,json:JSON.stringify(db)}));
      cfg.lastLocalSnap=today;saveCfg();
    }
  }catch(e){}
  if(fbh.fs&&cfg.lastSnap!==today){
    (async()=>{try{
      await fbh.FS.setDoc(fbh.FS.doc(fbh.fs,'smartlab_snaps',today),{json:JSON.stringify(db),at:Date.now()});
      const old=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
      try{await fbh.FS.deleteDoc(fbh.FS.doc(fbh.fs,'smartlab_snaps',old));}catch(e){}
      cfg.lastSnap=today;saveCfg();
    }catch(e){}})();
  }
}
async function restoreSnap(){
  const dt=document.getElementById('snap_d').value;
  if(!dt)return;
  let json=null;
  if(fbh.fs){
    try{const s=await fbh.FS.getDoc(fbh.FS.doc(fbh.fs,'smartlab_snaps',dt));
      if(s.exists())json=s.data().json;}catch(e){}
  }
  if(!json){
    try{const loc=JSON.parse(localStorage.getItem('sml_snap_local')||'null');
      if(loc&&loc.d===dt)json=loc.json;}catch(e){}
  }
  if(!json)return alert(t('snapNone'));
  if(!confirm(t('snapConfirm')))return;
  const nd=JSON.parse(json);
  nd.rev=(db.rev||0)+1;nd.adminHash=nd.adminHash||db.adminHash;
  db=nd;save();render();
}
function setSS(s,msg){window.__ss=[s,msg||''];const el=document.getElementById('syncst');if(el&&tab==='data')render()}
function cloudPush(){
  if(!fbh.doc||applying)return;
  clearTimeout(pushT);
  pushT=setTimeout(async()=>{
    try{await fbh.setDoc(fbh.doc,{json:JSON.stringify(db),rev:db.rev||0,device:cfg.device||'',at:Date.now()});setSS('on')}
    catch(e){setSS('err',e.code||e.message)}
  },900);
}
async function initSync(){
  if(!cfg.fbOn||!cfg.fb){setSS('off');return}
  try{
    const conf=JSON.parse(cfg.fb);
    const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const AU=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const FS=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    const app=A.initializeApp(conf);
    await AU.signInAnonymously(AU.getAuth(app));
    const fs=FS.getFirestore(app);
    fbh.doc=FS.doc(fs,'smartlab','main');fbh.setDoc=FS.setDoc;fbh.FS=FS;fbh.fs=fs;
    FS.onSnapshot(fbh.doc,snap=>{
      if(!snap.exists()){cloudPush();return}
      const r=snap.data();
      if(r&&typeof r.rev==='number'&&r.rev>(db.rev||0)){
        try{applying=true;db=JSON.parse(r.json);db.bookings=db.bookings||[];db.tasks=db.tasks||[];db.team=db.team||[];localStorage.setItem('sml_db',JSON.stringify(db));}finally{applying=false}
        render();
      }
      setSS('on');
    },e=>setSS('err',e.code||e.message));
    setSS('on');
    dailySnap();
  }catch(e){setSS('err',e.code||e.message)}
}
function svSync(on){
  cfg.device=document.getElementById('sy_dev').value.trim();
  cfg.fb=document.getElementById('sy_cfg').value.trim();
  cfg.fbOn=on;saveCfg();
  if(on){initSync()}else{location.reload()}
  render();
}

function mdRender(src){
 let h=esc(src||'');
 h=h.replace(/^### (.*)$/gm,'<div style="font-weight:700;font-size:13px;color:var(--t1);margin:8px 0 3px">$1</div>');
 h=h.replace(/^## (.*)$/gm,'<div style="font-weight:800;font-size:14px;color:var(--g2);margin:10px 0 4px">$1</div>');
 h=h.replace(/^# (.*)$/gm,'<div style="font-weight:800;font-size:15px;color:var(--g1);margin:12px 0 5px">$1</div>');
 h=h.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
 h=h.replace(/`([^`]+)`/g,'<code style="background:var(--g5);padding:1px 6px;border-radius:5px;font-size:12px">$1</code>');
 h=h.replace(/(^|\n)((?:- .*(?:\n|$))+)/g,(m,p,b)=>p+'<ul style="padding-inline-start:18px;margin:6px 0">'+b.trim().split('\n').map(l=>'<li style="margin:3px 0">'+l.slice(2)+'</li>').join('')+'</ul>');
 h=h.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g,(m,p,b)=>p+'<ol style="padding-inline-start:18px;margin:6px 0">'+b.trim().split('\n').map(l=>'<li style="margin:3px 0">'+l.replace(/^\d+\. /,'')+'</li>').join('')+'</ol>');
 h=h.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" style="color:var(--g2)">$1</a>');
 h=h.replace(/\b(SML-\d{4}|CAB-[A-Za-z0-9]+|BOX-\d{3}|DRW-\d{3}|STN-\d{3}|SHL-\d{3})\b/g,'<a onclick="lookup(\'$1\')" style="color:var(--g1);font-weight:700;text-decoration:underline;cursor:pointer">$1</a>');
 h=h.replace(/\n/g,'<br>');
 return h;
}

     <button class="btn sec" onclick="${id?`openDoc('${id}')`:'closeM()'}">${t('cancel')}</button>
   </div>`);
}
function saveDoc(id){
  const v=k=>document.getElementById(k).value;
  if(!v('k_title').trim())return alert(t('need'));
  const tags=v('k_tags').split(',').map(s=>s.trim()).filter(Boolean);
  if(id){
    const x=db.docs.find(k=>k.id===id);
    x.hist=(x.hist||[]);x.hist.unshift({t:x.updated,who:x.author,body:x.body});x.hist=x.hist.slice(0,10);
    Object.assign(x,{title:v('k_title').trim(),type:v('k_type'),tags,body:v('k_body'),author:cfg.device||x.author||'',updated:now()});
    log(id,t('logEdit'),x.title);
  }else{
    const kid='KB-'+pad3(db.seqK++);
    db.docs.unshift({id:kid,title:v('k_title').trim(),type:v('k_type'),tags,body:v('k_body'),author:cfg.device||'',created:now(),updated:now(),hist:[]});
    log(kid,t('logAdd'),v('k_title').trim());id=kid;
  }
  save();openDoc(id);render();
}

const CTYPES=[['cabinet','tCab','🗄'],['drawer','tDrw','🗃'],['box','tBox','📦'],['station','tStn','🛠'],['shelf','tShl','🧱']];
const CPRE={cabinet:'CAB',drawer:'DRW',box:'BOX',station:'STN',shelf:'SHL'};
const pad3=n=>('000'+n).slice(-3);
function cLabel(ty){const e=CTYPES.find(c=>c[0]===ty);return e?e[2]+' '+t(e[1]):ty}
function contForm(id){
 const c0=id?db.containers.find(k=>k.id===id):{};
 sheet(`<h3>${id?t('edit')+' — '+id:t('addCont')}</h3>
  <label class="f">${t('name')} *</label><input id="c_name" value="${esc(c0.name||'')}">
  <label class="f">${t('cType')}</label><select id="c_type" ${id?'disabled':''}>${CTYPES.map(ct=>`<option value="${ct[0]}" ${c0.type===ct[0]?'selected':''}>${ct[2]} ${t(ct[1])}</option>`).join('')}</select>
  <label class="f">${t('loc')}</label><input id="c_loc" list="locdl2" value="${esc(c0.location||LOCS[0])}"><datalist id="locdl2">${LOCS.map(c=>`<option value="${c}">`).join('')}</datalist>
  <label class="f">${t('notes')}</label><input id="c_notes" value="${esc(c0.notes||'')}">
  <div class="row" style="margin-top:12px">
   <button class="btn" onclick="saveCont('${id||''}')">${t('save')}</button>
   <button class="btn sec" onclick="closeM()">${t('cancel')}</button></div>`);

function saveCont(id){
 const v=k=>document.getElementById(k).value.trim();
 if(!v('c_name'))return alert(t('need'));
 if(id){const c0=db.containers.find(k=>k.id===id);Object.assign(c0,{name:v('c_name'),location:v('c_loc'),notes:v('c_notes')});log(id,t('logEdit'),'');}
 else{const ty=document.getElementById('c_type').value;const cid=CPRE[ty]+'-'+pad3(db.seqC++);
   db.containers.push({id:cid,name:v('c_name'),type:ty,location:v('c_loc'),notes:v('c_notes')});log(cid,t('logAdd'),v('c_name'));}
 save();closeM();render();
}
function delCont(id){
 adminDo(()=>{
  if(db.items.some(i=>i.container===id))return;
  db.containers=db.containers.filter(c=>c.id!==id);log(id,t('logDel'),'');save();closeM();render();
 });
}
function bumpName(n){
  let m=n.match(/(\d+)(\s*\/\s*\d+)/); if(m)return n.replace(/(\d+)(\s*\/\s*\d+)/,(Number(m[1])+1)+m[2]);
  m=n.match(/(\d+)\s*$/); if(m)return n.replace(/\d+\s*$/,String(Number(m[1])+1));
  return n+' 2';
}
function dupCont(id){
  const c0=db.containers.find(k=>k.id===id);if(!c0)return;
  const cid=CPRE[c0.type]+'-'+pad3(db.seqC++);
  db.containers.push({id:cid,name:bumpName(c0.name),type:c0.type,location:c0.location,notes:c0.notes});
  log(cid,t('logAdd'),bumpName(c0.name));save();openCont(cid);render();
}
function openCont(id){

  sheet(`
   <div class="itemhead"><div>

let selIds=new Set(), lblSize='50x30';
const SIZES={'50x30':[384,240],'50x50r':[384,384],'50x80':[384,640]};
function vLabels(){
  return `<div class="card"><h2>${t('labels')} — NIIMBOT B1</h2>
   <div class="row" style="margin-bottom:8px">
    <span class="pill ${lblSize==='50x30'?'on':''}" onclick="lblSize='50x30';render()">50×30</span>
    <span class="pill ${lblSize==='50x50r'?'on':''}" onclick="lblSize='50x50r';render()">50×50 ⬤</span>
    <span class="pill ${lblSize==='50x80'?'on':''}" onclick="lblSize='50x80';render()">50×80</span>
    <button class="btn sec sm" onclick="[...db.items,...db.containers].forEach(x=>selIds.add(x.id));render()">${t('selAll')}</button>
    <button class="btn sec sm" onclick="selIds.clear();render()">${t('clear')}</button>
    <button class="btn sm" onclick="drawSelected(true)">${t('dlAll')}</button>
    <button class="btn sm" style="background:var(--t1)" onclick="makePdf()">📄 ${t('dlPdf')}</button>
   </div>
   <div style="max-height:220px;overflow:auto;border:1px solid var(--g4);border-radius:10px;padding:6px;margin-bottom:12px">
    ${[...db.containers,...db.items].map(x=>`<label style="display:flex;gap:8px;align-items:center;padding:5px;font-size:12.5px">
      <input type="checkbox" class="chk" ${selIds.has(x.id)?'checked':''} onchange="this.checked?selIds.add('${x.id}'):selIds.delete('${x.id}');drawSelected()">
      <b>${x.id}</b> ${esc(x.name)}</label>`).join('')||`<div class="empty">—</div>`}
   </div>
   <div id="lblout" class="grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))"></div>
   <p class="hint">203 dpi · ${t('pick')} · PNG → NIIMBOT app → Print image</p></div>`;
}
function drawSelected(dl){
  const out=document.getElementById('lblout');if(!out)return;out.innerHTML='';
  const [W,H]=SIZES[lblSize];
  const wrap=(g,txt,max)=>{const words=String(txt).split(' ');const lines=[];let cur='';
    for(const w of words){const t=cur?cur+' '+w:w;
      if(g.measureText(t).width>max&&cur){lines.push(cur);cur=w}else cur=t}
    if(cur)lines.push(cur);return lines.slice(0,2)};
  [...selIds].forEach(id=>{
    const x=db.items.find(i=>i.id===id)||db.containers.find(i=>i.id===id);if(!x)return;
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;cv.className='lblcanvas';
    const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);
    const qr=qrcode(0,'M');qr.addData(x.id);qr.make();
    const n=qr.getModuleCount();
    let loc=(x.location||'').split('–')[0].trim();if(x.type)loc=cLabel(x.type)+' · '+loc;
    g.fillStyle='#000';
    if(lblSize==='50x30'){
      const qs=Math.floor(190/n),qw=qs*n,qx=W-qw-10,qy=(H-qw)/2;
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))g.fillRect(qx+c*qs,qy+r*qs,qs,qs);
      const tx=12,maxw=qx-24;g.textAlign='start';
      g.font='800 46px Alexandria, Arial';g.fillText(x.id,tx,62);
      g.font='600 27px Alexandria, Arial';
      const ls=wrap(g,x.name,maxw);
      g.fillText(ls[0]||'',tx,110,maxw);if(ls[1])g.fillText(ls[1],tx,144,maxw);
      g.font='400 22px Alexandria, Arial';g.fillText(loc,tx,ls[1]?188:160,maxw);
    }else if(lblSize==='50x50r'){
      const qs=Math.floor(212/n),qw=qs*n,qx=(W-qw)/2,qy=34;
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))g.fillRect(qx+c*qs,qy+r*qs,qs,qs);
      g.textAlign='center';
      g.font='800 42px Alexandria, Arial';g.fillText(x.id,W/2,qy+qw+50);
      g.font='600 24px Alexandria, Arial';
      const ls=wrap(g,x.name,W*0.78);
      g.fillText(ls[0]||'',W/2,qy+qw+86,W*0.78);if(ls[1])g.fillText(ls[1],W/2,qy+qw+114,W*0.78);
    }else{
      const qs=Math.floor(300/n),qw=qs*n,qx=(W-qw)/2,qy=34;
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))g.fillRect(qx+c*qs,qy+r*qs,qs,qs);
      g.textAlign='center';
      g.font='800 52px Alexandria, Arial';g.fillText(x.id,W/2,qy+qw+62);
      g.font='600 30px Alexandria, Arial';
      const ls=wrap(g,x.name,W-36);
      g.fillText(ls[0]||'',W/2,qy+qw+104,W-36);if(ls[1])g.fillText(ls[1],W/2,qy+qw+140,W-36);
      g.font='400 24px Alexandria, Arial';g.fillText(loc,W/2,ls[1]?qy+qw+180:qy+qw+144,W-36);
    }
    const wrapEl=document.createElement('div');
    wrapEl.appendChild(cv);
    const b=document.createElement('button');b.className='btn sec sm';b.style.marginTop='4px';b.textContent=t('dl');
    b.onclick=()=>{const a=document.createElement('a');a.download=x.id+'_'+lblSize+'.png';a.href=cv.toDataURL();a.click()};
    wrapEl.appendChild(b);out.appendChild(wrapEl);
    if(dl){const a=document.createElement('a');a.download=x.id+'_'+lblSize+'.png';a.href=cv.toDataURL();a.click()}
  });
  if(!selIds.size)out.innerHTML=`<div class="empty">${t('pick')}</div>`;
}

const ABBR=[
 [/Supplementary equipment set to (the )?equipment set( for)?( the)?/gi,'Suppl. set:'],
 [/Supplementary equipment set/gi,'Suppl. set'],
 [/equipment set/gi,'set'],
 [/with pushbutton actuator/gi,'w/ pushbutton'],
 [/with selector switch/gi,'w/ selector'],
 [/normally closed/gi,'NC'],
 [/normally open/gi,'NO'],
 [/open-loop control and closed-loop control/gi,'control'],
 [/measuring, control/gi,'measurement & control'],
 [/Proximity switch/gi,'Prox. switch'],
 [/Proximity sensor/gi,'Prox. sensor'],
 [/with cylinder attachment/gi,'w/ cyl. mount'],
 [/One-way light barrier/gi,'Light barrier'],
 [/\band\b/gi,'&'],
 [/\bwith\b/gi,'w/'],
 [/\bfor the\b/gi,'for'],
 [/\s*[\u2013\u2014]\s*/g,' \u2013 '],
 [/\s{2,}/g,' ']];
const DANGLE=new Set(['to','for','of','the','w/','&','\u2013','-','a','an','in','on']);
function abbrevName(s){
  for(const [re,rp] of ABBR) s=s.replace(re,rp);
  return s.replace(/\s{2,}/g,' ').replace(/[ ,;:\u2013-]+$/,'').trim();
}
function stripDangle(s){
  const ws=s.split(' ');
  while(ws.length&&DANGLE.has(ws[ws.length-1].toLowerCase().replace(/[,;:]+$/,'')))ws.pop();
  return ws.join(' ').replace(/[ ,;:\u2013-]+$/,'');
}
function wrapMeasured(text,maxw,measure){
  const words=text.split(' ');const lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;
    if(measure(t)>maxw&&cur){lines.push(cur);cur=w}else cur=t}
  if(cur)lines.push(cur);return lines;
}
function fitName(name,maxw,measure){
  let s=abbrevName(name);let lines=wrapMeasured(s,maxw,measure);
  while(lines.length>3&&s.includes(' ')){
    s=stripDangle(s.substring(0,s.lastIndexOf(' ')));
    lines=wrapMeasured(s,maxw,measure);
  }
  return wrapMeasured(stripDangle(s),maxw,measure).slice(0,3);
}
let _pdfFontsLoaded=false;
function makePdf(){
  if(!selIds.size)return alert(t('pick'));
  const {jsPDF}=window.jspdf||{};
  if(!jsPDF)return alert('jsPDF not loaded — check internet connection');
  const doc=new jsPDF({unit:'mm',format:[50,30],orientation:'landscape'});
  doc.addFileToVFS('AlexReg.ttf',FONT_B64.Reg);doc.addFont('AlexReg.ttf','AlexReg','normal');
  doc.addFileToVFS('AlexSB.ttf',FONT_B64.SB);doc.addFont('AlexSB.ttf','AlexSB','normal');
  doc.addFileToVFS('AlexXB.ttf',FONT_B64.XB);doc.addFont('AlexXB.ttf','AlexXB','normal');
  const QS=20,QX=50-QS-1.5,QY=(30-QS)/2,TXm=1.8,MAXW=QX-TXm-1.6;
  let first=true;
  for(const id of selIds){
    const x=db.items.find(i=>i.id===id)||db.containers.find(i=>i.id===id);if(!x)continue;
    if(!first)doc.addPage([50,30],'landscape');first=false;
    const qr=qrcode(0,'M');qr.addData(x.id);qr.make();
    const n=qr.getModuleCount(),s=QS/n;
    doc.setFillColor(0,0,0);
    for(let r=0;r<n;r++)for(let c2=0;c2<n;c2++)
      if(qr.isDark(r,c2))doc.rect(QX+c2*s,QY+r*s,s,s,'F');
    doc.setFont('AlexXB','normal');doc.setFontSize(14);
    doc.text(x.id,TXm,7.6);
    doc.setFont('AlexSB','normal');doc.setFontSize(8);
    const ls=fitName(x.name,MAXW,tt=>doc.getTextWidth(tt));
    ls.forEach((ln,k)=>doc.text(ln,TXm,12.9+k*4.1));
    doc.setFont('AlexReg','normal');doc.setFontSize(7.5);
    let loc=(x.location||'').split('\u2013')[0].trim();
    if(x.type)loc=x.type.charAt(0).toUpperCase()+x.type.slice(1)+' \u00b7 '+loc;
    doc.text(loc,TXm,30-2.3);
  }
  doc.save('SMART_Lab_Labels_'+selIds.size+'.pdf');
}

let scanner=null;
function vScan(){
  setTimeout(()=>{},0);
  return `<div class="card"><h2>${t('scanTitle')}</h2>
   <div id="scanbox"></div>
   <div class="row" style="margin-top:10px">
    <button class="btn" id="scanBtn" onclick="startScan()">📷 ${t('scanStart')}</button>
   </div>
   <label class="f">${t('scanManual')}</label>
   <input id="manual" placeholder="SML-0001" onkeydown="if(event.key==='Enter'){lookup(this.value.trim())}">
  </div>`;
}
function startScan(){
  const btn=document.getElementById('scanBtn');
  if(scanner){stopScan();return}
  scanner=new Html5Qrcode('scanbox');
  btn.textContent='⏹ '+t('scanStop');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:220},
    txt=>{stopScan();navigator.vibrate&&navigator.vibrate(80);lookup(txt)},
    ()=>{});

function dlFile(name,content,type){const a=document.createElement('a');a.download=name;a.href=URL.createObjectURL(new Blob([content],{type}));a.click()}

function expC(){
  const head='id,name,nameAr,category,location,status,qty,minQty,serial,notes,container';
  const rows=db.items.map(x=>[x.id,x.name,x.nameAr,x.category,x.location,x.status,x.qty,x.minQty,x.serial,(x.notes||'').replace(/\n/g,' '),x.container||'']
   .map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(','));
  dlFile('smartlab_items.csv','\uFEFF'+head+'\n'+rows.join('\n'),'text/csv');

function impC(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{
    try{
      const lines=r.result.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());
      const parse=s=>{const o=[];let cur='',inq=false;for(let ch of s){if(ch==='"'){inq=!inq;cur+='';continue}if(ch===','&&!inq){o.push(cur);cur=''}else cur+=ch}o.push(cur);return o.map(x=>x.trim())};
      const head=parse(lines[0]).map(h=>h.toLowerCase());
      let added=0;
      for(let i=1;i<lines.length;i++){
        const c=parse(lines[i]);const g=k=>c[head.indexOf(k)]||'';
        if(!g('name'))continue;
        const obj={id:g('id')||nid(),name:g('name'),nameAr:g('namear'),category:g('category')||'Other',
          location:g('location')||LOCS[0],status:['ok','out','mnt','miss'].includes(g('status'))?g('status'):'ok',
          qty:+g('qty')||1,minQty:+g('minqty')||0,serial:g('serial'),notes:g('notes'),container:g('container')};
        const ex=db.items.find(x=>x.id===obj.id);
        if(ex)Object.assign(ex,obj);else db.items.push(obj);
        added++;
      }
      save();render();alert(t('imported')+': '+added);
    }catch(e){alert(t('invalid'))}
  };r.readAsText(f);
}

const inNow=n=>db.att.find(a=>a.name===n&&!a.out&&(Date.now()-new Date(a.in))<12*3600e3);
function toggleAtt(){const a=inNow(ME());if(a)a.out=now();else{db.att.unshift({name:ME(),in:now(),out:''});db.att=db.att.slice(0,3000)}save();render()}
const projName=id=>{const p=db.projects.find(x=>x.id===id);return p?p.name:''};
const jsq=s=>esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

/* ---------- sign-in (students) ---------- */
function authed(){return !!ME()&&cfg.authed===ME()}
function vLogin(){const names=db.team;
  return `<div class="card lock"><div class="big">${t('signIn')}</div>
   <label class="f">${t('yourName')}</label>${names.length?`<select id="lg_n">${names.map(n=>`<option ${n===ME()?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<input id="lg_n" value="${esc(ME())}"><div class="hint">${t('noTeamYet')}</div>`}
   <label class="f">PIN</label><input id="lg_p" type="password" inputmode="numeric" maxlength="12" placeholder="${t('pinHint')}">
   <div class="row" style="margin-top:14px;justify-content:center"><button class="btn" onclick="doLogin()">${t('enter')}</button></div></div>`}
async function doLogin(){const n=document.getElementById('lg_n').value.trim(),p=document.getElementById('lg_p').value.trim();

let tkView='board',tkProj='';
function vTasks(){let list=db.tasks.slice();if(tkMine)list=list.filter(x=>x.assignee===ME());if(tkProj)list=list.filter(x=>x.project===tkProj);

  const wk=Date.now()-7*864e5,col=s=>{const a=list.filter(x=>x.status===s&&(s!=='done'||!x.doneAt||new Date(x.doneAt)>wk));return `<div class="kcol"><h4><span>${t(TS[s][1])}</span><span>${a.length}</span></h4>${a.map(card).join('')||'<div class="hint">—</div>'}</div>`};
  return `<div class="row" style="margin-bottom:10px"><button class="btn" onclick="taskForm()">＋ ${t('newTask')}</button>
    <span class="pill ${tkMine?'on':''}" onclick="tkMine=true;render()">${t('myTasks')}</span><span class="pill ${!tkMine?'on':''}" onclick="tkMine=false;render()">${t('allTasks')}</span>
    <span class="pill ${tkView==='board'?'on':''}" onclick="tkView='board';render()">▦ ${t('board')}</span><span class="pill ${tkView==='list'?'on':''}" onclick="tkView='list';render()">☰ ${t('list')}</span></div>
  ${db.projects.length?`<div style="margin-bottom:10px"><select onchange="tkProj=this.value;render()"><option value="">${t('allProj')}</option>${db.projects.map(p=>`<option value="${p.id}" ${tkProj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`:''}

   <div><label class="f">${t('due')}</label><input type="date" id="tk_due" value="${x.due||''}"></div></div>
   <label class="f">${t('project')}</label><select id="tk_p"><option value="">${t('noProject')}</option>${db.projects.map(p=>`<option value="${p.id}" ${p.id===x.project?'selected':''}>${esc(p.name)}</option>`).join('')}</select>

/* ---------- me: record + clearances ---------- */
function recStats(n){return{hm:hoursOf(n,monthStart()),ht:hoursOf(n),done:db.tasks.filter(x=>x.assignee===n&&x.status==='done').length,sk:db.skills.filter(s=>isCleared(n,s.id)).length}}
function skillGrid(n,admin){return `<div class="sk">${db.skills.map(s=>{const ok=isCleared(n,s.id),rq=db.creq.find(r=>r.name===n&&r.skill===s.id);
  const act=admin?`<button class="btn ${ok?'sec':''} sm" onclick="setClear('${jsq(n)}','${s.id}',${!ok})">${ok?'✕':t('grant')}</button>`
    :(ok?'':rq?`<span class="hint">⏳ ${t('requested')}</span>`:`<button class="btn sec sm" onclick="reqClear('${s.id}')">${t('reqClear')}</button>`);
  return `<div class="skc ${ok?'ok':'lk'}"><span class="ic">${ok?s.ic:'🔒'}</span><b>${esc(skName(s))}</b>${ok?`<span class="hint">✓ ${t('cleared')} · ${fdate(db.clear[n][s.id].date)}</span>`:''}${act}</div>`}).join('')}</div>`}
function reqClear(id){if(!db.creq.find(r=>r.name===ME()&&r.skill===id)){db.creq.push({name:ME(),skill:id,date:now()});log(id,'🎖 '+t('reqClear'),ME());save()}render()}
function setClear(n,id,on){db.clear[n]=db.clear[n]||{};if(on)db.clear[n][id]={by:WHO(),date:now()};else delete db.clear[n][id];
  db.creq=db.creq.filter(r=>!(r.name===n&&r.skill===id));log(id,(on?'🎖 ':'✕ ')+t('cleared'),n);save();if(document.getElementById('modal').classList.contains('on'))personSheet(n);render()}
function declineClear(n,id){db.creq=db.creq.filter(r=>!(r.name===n&&r.skill===id));save();render()}
function recKpis(n){const r=recStats(n);return `<div class="rec">${[[r.hm.toFixed(1),'hoursM'],[r.ht.toFixed(1),'hoursT'],[r.done,'doneM'],[r.sk+' / '+db.skills.length,'skillsN']].map(a=>`<div class="kpi"><div class="v">${a[0]}</div><div class="l">${t(a[1])}</div></div>`).join('')}</div>`}
function sumText(n){const r=recStats(n),sk=db.skills.filter(s=>isCleared(n,s.id)).map(s=>s.en),dn=db.tasks.filter(x=>x.assignee===n&&x.status==='done').map(x=>'- '+x.title);
  return `STARK · Smart Technologies, Automation & Robotics at KAU\n${n}\n\nLab hours: ${r.ht.toFixed(1)}\nMissions completed: ${r.done}\nClearances (${sk.length}): ${sk.join(', ')||'—'}\n\nCompleted missions:\n${dn.join('\n')||'—'}\n\nIssued ${todayStr()}`}
function copySum(n){const tx=sumText(n);(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).then(()=>alert(t('copied')),()=>prompt('',tx))}
function printSum(n){const r=recStats(n);sheet(`<h3 style="color:var(--g1)">STARK</h3><div class="hint">Smart Technologies, Automation & Robotics at KAU</div>
  <h2 style="margin:14px 0 4px">${esc(n)}</h2>${recKpis(n)}
  <h4 class="sec">🎖 ${t('clearances')}</h4><div>${db.skills.filter(s=>isCleared(n,s.id)).map(s=>`<span class="tag tg-ok">${s.ic} ${esc(skName(s))}</span>`).join(' ')||'—'}</div>
  <h4 class="sec">✅ ${t('doneM')}</h4>${db.tasks.filter(x=>x.assignee===n&&x.status==='done').map(x=>`<div class="logrow">${esc(x.title)}${x.project?' <span class="t">'+esc(projName(x.project))+'</span>':''}</div>`).join('')||'—'}
  <div class="hint" style="margin-top:12px">${todayStr()}</div>
  <div class="row noprint" style="margin-top:14px"><button class="btn" onclick="window.print()">🖨 ${t('printSum')}</button><button class="btn sec" onclick="closeM()">${t('cancel')}</button></div>`)}
function vMe(){const n=ME();return `<div class="hero"><div><div class="hi">${esc(n)}</div><div class="tl">${t('record')}</div></div><button class="btn sec sm" onclick="signOut()">${t('signOut')}</button></div>
  ${recKpis(n)}
  <div class="row" style="margin:12px 0"><button class="btn sm" onclick="printSum('${jsq(n)}')">🖨 ${t('printSum')}</button><button class="btn sec sm" onclick="copySum('${jsq(n)}')">⧉ ${t('copySum')}</button><button class="btn sec sm" onclick="go('data')">⚙️ ${t('settings')}</button></div>
  <div class="card"><h2>🎖 ${t('clearances')}</h2>${skillGrid(n,false)}</div>`}

/* ---------- lab hub + faults ---------- */
function faultRows(){const f=db.faults.filter(x=>x.status!=='fixed');return f.length?f.map(x=>`<div class="rowx"><div><div class="tt">${esc(x.text)}</div><div class="tm">${esc(x.where)} · ${esc(x.by)} · ${fdate(x.date)}</div></div>
   <div class="row" style="flex-wrap:nowrap">${x.photo?`<img class="thumb" src="${x.photo}" alt="" onclick="sheet('<img src=&quot;'+this.src+'&quot; style=&quot;width:100%;border-radius:12px&quot;>')">`:''}${MODE==='director'?`<button class="btn sm" onclick="fixFault('${x.id}')">${t('fixed')}</button>`:''}</div></div>`).join(''):`<div class="empty">${t('noFaults')}</div>`}
function fixFault(id){const x=db.faults.find(k=>k.id===id);x.status='fixed';x.fixedAt=now();x.photo='';log(id,'🔧 '+t('fixed'),x.where);save();render()}
let fPhoto='';
function faultForm(pref){fPhoto='';sheet(`<h3>🔧 ${t('reportFault')}</h3>
  <label class="f">${t('where')}</label><input id="ft_w" list="ft_l" value="${esc(pref||'')}"><datalist id="ft_l">${LOCS.map(r=>`<option value="${esc(r)}">`).join('')}</datalist>
  <label class="f">${t('whatWrong')}</label><textarea id="ft_t" rows="3"></textarea>
  <label class="btn sec sm" style="margin-top:10px;display:inline-flex">📷 ${t('addPhoto')}<input type="file" accept="image/*" capture="environment" hidden onchange="shrink(this.files[0],520,.55,d=>{fPhoto=d;document.getElementById('ft_pv').src=d;document.getElementById('ft_pv').hidden=false})"></label>
  <img id="ft_pv" hidden alt="" style="display:block;max-width:160px;border-radius:10px;margin-top:8px">
  <div class="row" style="margin-top:14px"><button class="btn" onclick="saveFault()">${t('send')}</button><button class="btn sec" onclick="closeM()">${t('cancel')}</button></div>`)}
function saveFault(){const w=document.getElementById('ft_w').value.trim(),tx=document.getElementById('ft_t').value.trim();if(!w||!tx)return alert(t('need'));
  const id='FLT-'+Date.now().toString(36);db.faults.unshift({id,where:w,text:tx,photo:fPhoto,by:WHO(),date:now(),status:'open'});
  db.faults.forEach((f,i)=>{if(i>=15)f.photo=''});db.faults=db.faults.slice(0,300);log(id,'🔧 '+t('reportFault'),w+': '+tx);save();closeM();render()}
function shrink(file,max,q,cb,fail){if(!file)return;const r=new FileReader();r.onerror=()=>fail&&fail();r.onload=()=>{const im=new Image();im.onerror=()=>fail&&fail();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',q))};im.src=r.result};r.readAsDataURL(file)}
function vLab(){const T2=[['book','📅','bookSt'],['scan','📷','scanQr'],['items','📦','inventory'],['labels','🏷️','labelsT']];if(MODE==='director')T2.push(['logs','🕘','activity']);
  return `<div class="tiles">${T2.map(a=>`<button class="tile" onclick="go('${a[0]}')"><span class="ic">${a[1]}</span>${t(a[2])}</button>`).join('')}<button class="tile" onclick="faultForm()"><span class="ic">🔧</span>${t('reportFault')}</button></div>
  <div class="card"><h2>🔧 ${t('openFaults')}</h2>${faultRows()}</div>${MODE==='director'?`<h4 class="sec">🏭 ${t('labHealth')}</h4>`+vDashInv():''}`}
function saveBk(){const v=k=>document.getElementById(k).value.trim();
  const ti=v('bk_t'),r=v('bk_r'),dt=v('bk_d'),s=v('bk_s'),e=v('bk_e'),w=+v('bk_w')||0,by=MODE==='intern'?ME():v('bk_b');
  if(!ti||!dt||!s||!e||e<=s)return alert(t('need'));
  if(MODE==='intern'&&!canUse(ME(),r))return alert(t('needClear'));
  const news=[];for(let k=0;k<=w;k++){const dd=addDays(dt,7*k);
    if(db.bookings.some(b=>b.resource===r&&b.date===dd&&!(e<=b.start||s>=b.end)))return alert(t('conflict')+' ('+dd+')');
    news.push({id:'B'+Date.now().toString(36)+k,title:ti,resource:r,date:dd,start:s,end:e,by})}
  db.bookings.push(...news);log(r,'📅 '+ti,news[0].date+(w?(' ×'+(w+1)):'')+' '+s);save();closeM();render()}

/* ---------- projects ---------- */
function projProg(p){const ts=db.tasks.filter(x=>x.project===p.id),d=ts.filter(x=>x.status==='done').length;return{n:ts.length,d,pc:ts.length?Math.round(d/ts.length*100):0}}
function projRow(p){const g=projProg(p);return `<div class="rowx" style="cursor:pointer" onclick="openProj('${p.id}')"><div style="flex:1"><div class="tt">${esc(p.name)}</div><div class="tm">${esc(p.lead||'—')} · ${(p.members||[]).length} · ${g.d}/${g.n}</div><div class="pbar"><i style="width:${g.pc}%"></i></div></div><b>${g.pc}%</b></div>`}
function vProj(){return `<div class="row" style="margin-bottom:10px"><button class="btn" onclick="projForm()">＋ ${t('newProj')}</button></div><div class="card">${db.projects.length?db.projects.map(projRow).join(''):'<div class="empty">—</div>'}</div>`}

  sheet(`<h3>${id?t('edit'):t('newProj')}</h3><label class="f">${t('name')}</label><input id="pj_n" value="${esc(p.name)}">

function askDraw(){const a=lastAns(true);askImgs.forEach((src,k)=>{const c=document.getElementById('ak_c'+k);if(!c)return;const im=new Image();im.onload=()=>{c.width=im.width;c.height=im.height;const g=c.getContext('2d');g.drawImage(im,0,0);

async function askPost(payload){let last;
  for(let tries=0;tries<2;tries++){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),90000);
    try{const r=await fetch(db.relay,{method:'POST',headers:{'Content-Type':'application/json'},body:payload,signal:ac.signal});clearTimeout(tm);
      const j=await r.json().catch(()=>({error:'HTTP '+r.status}));if(!r.ok||j.error){const e=new Error(j.error||('HTTP '+r.status));e.server=true;throw e}return j}
    catch(e){clearTimeout(tm);last=e;if(e.server)throw e;await new Promise(r=>setTimeout(r,1500))}}
  const mb=(payload.length/1048576).toFixed(1);
  throw new Error(last&&last.name==='AbortError'?(lang==='ar'?`الرد تأخر كثير. تأكد من الإنترنت وجرّب مرة ثانية (حجم الصور ${mb} ميقا).`:`The answer took too long. Check your connection and try again (${mb} MB of photos).`)
    :(lang==='ar'?`انقطع الاتصال أثناء الإرسال. غالباً الإنترنت ضعيف، جرّب مرة ثانية أو قلّل الصور (حجمها ${mb} ميقا).`:`The connection dropped while sending. The network is probably weak; try again or send fewer photos (${mb} MB).`))}

    if(!db.relay){await new Promise(r=>setTimeout(r,700));res=DEMO_ANS()}
    else{const payload=JSON.stringify({idToken:await cloudToken(),key:db.relayKey||'',user:WHO(),lang,question:q,images:askImgs.map(d=>d.split(',')[1]),station:st,knowledge:kbFor(st),cleared:clr,history:hist});
      const j=await askPost(payload);res=j.answer||j}
    res.steps=(res.steps||[]).filter(s=>s&&s.text);askThread.push({r:'a',a:res});askStore(st)}
  catch(e){askThread.push({r:'a',a:{summary:t('askErr')+': '+(e.message||e),steps:[],safety:[],confidence:'low'}})}

const GLOGO='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.8 6C12.3 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.8-6z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.3 0-11.7-4.1-13.5-9.8l-7.8 6C6.6 42.6 14.6 48 24 48z"/></svg>';
function authed(){return !!me}
function vLogin(){
  if(bootState==='loading')return `<div class="card gate"><div class="big">STARK</div><p>${t('loading')}</p></div>`;
  if(bootState==='nocfg')return `<div class="card gate"><div class="big">STARK</div><p>${t('notCfg')}</p></div>`;
  if(bootState==='noaccess')return `<div class="card gate"><div class="big">🔒 ${t('noAccess')}</div><p>${t('noAccessP')}<br><b style="direction:ltr;display:inline-block;user-select:all">${esc(bootMsg)}</b></p><button class="gbtn" onclick="cloudSignOut()">${t('other')}</button></div>`;
  return `<div class="card gate"><div class="big">${t('gateT')}</div><p>${t('gateP')}${bootState==='error'?'<br><span style="color:var(--maroon)">'+esc(bootMsg)+'</span>':''}</p><button class="gbtn" onclick="cloudSignIn()">${GLOGO}${t('gsign')}</button></div>`}
async function cloudSignIn(){const A=cloud.AU,p=new A.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});
  try{await A.signInWithPopup(cloud.auth,p)}catch(e){if(/popup|cancelled|operation-not-supported/.test(e.code||'')){try{await A.signInWithRedirect(cloud.auth,p)}catch(e2){bootState='error';bootMsg=e2.code||e2.message;render()}}else{bootState='error';bootMsg=e.code||e.message;render()}}}
function cloudSignOut(){try{localStorage.removeItem('sml_db')}catch(e){}cloud.AU.signOut(cloud.auth).then(()=>location.reload())}
function signOut(){cloudSignOut()}
async function cloudToken(){try{return await cloud.auth.currentUser.getIdToken()}catch(e){return ''}}
async function adminDo(fn){if(isDir)return fn();alert(t('dirOnly'))}
function splitDb(){const o={},meta={},conf={};for(const k in db){if(SKIP_KEYS.includes(k))continue;const v=db[k];
  if(CFG_KEYS.includes(k))conf[k]=v;else if(v&&typeof v==='object')o[k]=JSON.stringify(v);else meta[k]=v}
  o.meta=JSON.stringify(meta);o.config=JSON.stringify(conf);return o}
function applyDoc(id,v){let x;try{x=JSON.parse(v)}catch(e){return}if(id==='meta'||id==='config')Object.assign(db,x);else db[id]=x}
function cloudPush(){if(!cloud||!cloud.ready||!me)return;clearTimeout(pushT);pushT=setTimeout(async()=>{
  const p=splitDb(),w=[];for(const k in p){if(p[k]===lastSent[k])continue;if(!isDir&&OWNER_KEYS.includes(k))continue;
    if(p[k].length>950000){setSS('err',k+': too large');continue}
    lastSent[k]=p[k];w.push(cloud.FS.setDoc(cloud.FS.doc(cloud.fs,'stark',k),{v:p[k],by:me.email,at:Date.now()}))}
  try{await Promise.all(w);setSS('on')}catch(e){setSS('err',e.code||e.message)}},500)}
function softRender(){const a=document.activeElement,m=document.getElementById('main');
  if(a&&m&&m.contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendRender=true;return}
  clearTimeout(renderT);renderT=setTimeout(()=>{render()},60)}
document.addEventListener('focusout',()=>{if(pendRender){pendRender=false;setTimeout(softRender,120)}});
function initSync(){}
function dailySnap(){if(!cloud||!isDir)return;const today=new Date().toISOString().slice(0,10);if(cfg.lastSnap===today)return;
  (async()=>{try{const j=JSON.stringify(db);if(j.length>950000)return;await cloud.FS.setDoc(cloud.FS.doc(cloud.fs,'smartlab_snaps',today),{json:j,at:Date.now()});
    const old=new Date(Date.now()-14*864e5).toISOString().slice(0,10);try{await cloud.FS.deleteDoc(cloud.FS.doc(cloud.fs,'smartlab_snaps',old))}catch(e){}
    cfg.lastSnap=today;saveCfg()}catch(e){}})()}
async function loadMembers(){if(!isDir)return;try{const qs=await cloud.FS.getDocs(cloud.FS.collection(cloud.fs,'members'));
  MEMBERS=qs.docs.map(d=>Object.assign({email:d.id},d.data()));softRender()}catch(e){}}
async function addMember(){const v=k=>document.getElementById(k).value.trim();const n=v('tm_new'),e=v('tm_email').toLowerCase(),r=document.getElementById('tm_role').value;
  if(!n||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e))return alert(t('need'));
  await cloud.FS.setDoc(cloud.FS.doc(cloud.fs,'members',e),{name:n,role:r,by:me.email,at:Date.now()});
  TK();if(!db.team.includes(n))db.team.push(n);log(e,'👥 '+t('addMember'),n);save();await loadMembers();render()}
async function rmMember(n){const m=MEMBERS.find(x=>x.name===n);if(m){try{await cloud.FS.deleteDoc(cloud.FS.doc(cloud.fs,'members',m.email))}catch(e){return alert(e.code||e.message)}}
  TK();db.team=db.team.filter(k=>k!==n);save();await loadMembers();render()}
function vPeople(){const ms=monthStart(),byName={};MEMBERS.forEach(m=>byName[m.name]=m);
  return `<div class="card"><h2>👥 ${t('addMember')}</h2>
   <div class="duo"><div><label class="f">${t('memberName')}</label><input id="tm_new"></div><div><label class="f">${t('gmail')}</label><input id="tm_email" type="email" style="direction:ltr" placeholder="name@gmail.com"></div></div>
   <label class="f">${t('roleL')}</label><select id="tm_role"><option value="member">${t('member')}</option><option value="director">${t('director')}</option></select>
   <div class="row" style="margin-top:10px"><button class="btn" onclick="addMember()">＋ ${t('addMember')}</button></div></div>
  <div class="card">${people().length?people().map(n=>{const ts=db.tasks.filter(x=>x.assignee===n),rq=db.creq.filter(r=>r.name===n).length,m=byName[n];
    return `<div class="rowx" style="cursor:pointer" onclick="personSheet('${jsq(n)}')"><div><div class="tt"><span class="dot ${inNow(n)?'':'off'}"></span>${esc(n)} ${m?`<span class="role">${t(m.role==='director'?'director':'member')}</span>`:(n===ME()?`<span class="role">${t('director')}</span>`:'')}${rq?` <span class="tag tg-out">🎖 ${rq}</span>`:''}</div>
     <div class="tm">${m?esc(m.email)+' · ':''}${t('openT')} ${ts.filter(x=>x.status==='todo'||x.status==='doing').length} · ${t('tDone')} ${ts.filter(x=>x.status==='done').length} · ${hoursOf(n,ms).toFixed(1)} h · 🎖 ${db.skills.filter(s=>isCleared(n,s.id)).length}</div></div><span>›</span></div>`}).join(''):'<div class="empty">—</div>'}</div>`}
function vData(){const ss=window.__ss||['off',''],u=cloud&&cloud.auth.currentUser;
  return `<div class="card"><h2>👤 ${t('account')}</h2><div class="who">${u&&u.photoURL?`<img src="${esc(u.photoURL)}" alt="">`:''}<div><b>${esc(ME())}</b><div class="hint" style="direction:ltr;text-align:start">${esc(me?me.email:'')}</div></div></div>
   <div class="hint" style="margin-top:8px;color:${ss[0]==='err'?'var(--maroon)':'var(--g2)'}">☁️ ${ss[0]==='err'?esc(ss[1]):t('cloudOn')}</div>
   <div class="row" style="margin-top:10px"><button class="btn sec sm" onclick="cloudSignOut()">${t('signOut')}</button></div></div>
  ${isDir?relayCard()+`<div class="card"><h2>🕐 ${t('snapT')} ${cfg.lastSnap?('· ☁️ '+cfg.lastSnap):''}</h2><div class="row"><input type="date" id="snap_d" style="max-width:180px"><button class="btn sec sm" onclick="restoreSnap()">${t('snapRestore')}</button></div></div>
  <div class="card"><h2>${t('data')}</h2><div class="row">
   <button class="btn" onclick="expJ()">⬇️ ${t('exportJ')}</button><button class="btn sec" onclick="document.getElementById('impJ').click()">⬆️ ${t('importJ')}</button>
   <button class="btn" onclick="expC()">⬇️ ${t('exportC')}</button><button class="btn sec" onclick="document.getElementById('impC').click()">⬆️ ${t('importC')}</button></div>
   <input type="file" id="impJ" accept=".json" style="display:none" onchange="impJ(this)"><input type="file" id="impC" accept=".csv" style="display:none" onchange="impC(this)">
   <p class="hint" style="margin-top:10px">${t('dataHint')}</p></div>`:''}`}
async function cloudBoot(){
  if(!window.STARK_FB){bootState='nocfg';render();return}
  try{
    const [A,AU,FS]=await Promise.all(['app','auth','firestore'].map(n=>import(`https://www.gstatic.com/firebasejs/${FBV}/firebase-${n}.js`)));
    const app=A.initializeApp(window.STARK_FB),auth=AU.getAuth(app),fs=FS.getFirestore(app);
    cloud={A,AU,FS,app,auth,fs,ready:false};fbh.fs=fs;fbh.FS=FS;
    try{await AU.getRedirectResult(auth)}catch(e){}
    AU.onAuthStateChanged(auth,async u=>{
      if(!u){me=null;bootState='signin';render();return}
      try{
        const email=(u.email||'').toLowerCase(),oref=FS.doc(fs,'config','owner');
        let ow=await FS.getDoc(oref);
        if(!ow.exists()){try{await FS.setDoc(oref,{uid:u.uid,at:Date.now()})}catch(e){}ow=await FS.getDoc(oref)}
        let mem=null;isDir=ow.exists()&&ow.data().uid===u.uid;
        if(!isDir){const ms=await FS.getDoc(FS.doc(fs,'members',email));if(!ms.exists()){bootState='noaccess';bootMsg=email;me=null;render();return}mem=ms.data();isDir=mem.role==='director'}
        const want=isDir?'director':'intern';
        if(MODE!==want){location.replace(isDir?'director.html':'index.html');return}
        me={email,uid:u.uid};cfg.device=(mem&&mem.name)||u.displayName||email;cfg.authed=cfg.device;saveCfg();unlocked=true;
        FS.onSnapshot(FS.collection(fs,'stark'),snap=>{let ch=false;
          snap.docChanges().forEach(c=>{if(c.type==='removed')return;const id=c.doc.id,v=(c.doc.data()||{}).v;if(typeof v!=='string'||v===lastSent[id])return;lastSent[id]=v;applying=true;try{applyDoc(id,v)}finally{applying=false}ch=true});
          const first=!cloud.ready;cloud.ready=true;
          try{localStorage.setItem('sml_db',JSON.stringify(db))}catch(e){}
          if(first){DB2();if(isDir&&!db.team.includes(cfg.device)){db.team.push(cfg.device)}save();dailySnap();loadMembers();render()}else if(ch)softRender();
          setSS('on')},e=>{setSS('err',e.code||e.message);if(!cloud.ready){bootState='error';bootMsg=e.code||e.message;me=null;render()}});
      }catch(e){bootState='error';bootMsg=e.code||e.message;me=null;render()}
    });
  }catch(e){bootState='error';bootMsg=e.message||String(e);render()}
}

unlocked=true;
render();
cloudBoot();
